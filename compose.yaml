services:
  planka:
    image: ghcr.io/plankanban/planka:2.1.1
    restart: unless-stopped
    volumes:
      - data:/app/data
    networks:
      - default
      - proxy-network
    expose:
      - 1337
    environment:
      - BASE_URL=${PLANKA_URL}
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres/planka
      - SECRET_KEY=${PLANKA_SECRET_KEY}
      - TRUST_PROXY=true
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.planka.rule=Host(`${PLANKA_DOMAIN}`)"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - default
    environment:
      - POSTGRES_DB=planka
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d planka"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  data:
  db-data:

networks:
  default:
  proxy-network:
    external: true
